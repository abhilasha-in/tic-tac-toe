
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:24px;
  font-family:Arial,sans-serif;background:#f7f7f5;color:#30343b;
}
.game{width:100%;max-width:380px;text-align:center}
h1{font-size:30px;margin:0 0 25px}
.score{display:flex;justify-content:center;gap:32px;margin-bottom:22px}
.score div{font-size:12px;color:#777}
.score strong{display:block;font-size:25px;color:#30343b;margin-top:5px}
.status{font-size:16px;font-weight:600;min-height:24px;margin-bottom:18px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;aspect-ratio:1}
.cell{
  border:1px solid #e1e1dc;border-radius:14px;background:white;
  font-size:clamp(44px,12vw,66px);font-weight:600;
  cursor:pointer;display:grid;place-items:center;
}
.cell.x{color:#6489c5}
.cell.o{color:#d58a75}
.cell.winner{background:#e9f1e7;border-color:#8da88c}
button:focus-visible{outline:3px solid #8da88c;outline-offset:3px}
.reset{
  margin-top:24px;padding:11px 22px;border-radius:30px;
  border:1px solid #d8d8d2;background:transparent;
  font-size:14px;cursor:pointer;color:#30343b
}
.reset:hover{background:#eeeee9}
</style>
</head>
<body>
<main class="game">
  <h1>Tic-Tac-Toe</h1>
  <div class="score">
    <div>PLAYER X<strong id="xScore">0</strong></div>
    <div>DRAWS<strong id="drawScore">0</strong></div>
    <div>PLAYER O<strong id="oScore">0</strong></div>
  </div>
  <div class="status" id="status">Player X's turn</div>
  <div class="board" id="board">
    <button class="cell" aria-label="Cell 1"></button>
    <button class="cell" aria-label="Cell 2"></button>
    <button class="cell" aria-label="Cell 3"></button>
    <button class="cell" aria-label="Cell 4"></button>
    <button class="cell" aria-label="Cell 5"></button>
    <button class="cell" aria-label="Cell 6"></button>
    <button class="cell" aria-label="Cell 7"></button>
    <button class="cell" aria-label="Cell 8"></button>
    <button class="cell" aria-label="Cell 9"></button>
  </div>
  <button class="reset" id="reset">↻ Restart Game</button>
</main>
<script>
const cells=[...document.querySelectorAll('.cell')];
const status=document.getElementById('status');
const xScore=document.getElementById('xScore');
const oScore=document.getElementById('oScore');
const drawScore=document.getElementById('drawScore');

const winningLines=[
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
];

let board,turn,finished;
let scores={X:0,O:0,D:0};

function render(){
 cells.forEach((cell,i)=>{
  cell.textContent=board[i]||'';
  cell.className='cell'+(board[i]?' '+board[i].toLowerCase():'');
  cell.disabled=finished||!!board[i];
 });
 xScore.textContent=scores.X;
 oScore.textContent=scores.O;
 drawScore.textContent=scores.D;
}

function play(i){
 if(finished||board[i])return;
 board[i]=turn;

 const winningLine=winningLines.find(
  line=>line.every(n=>board[n]===turn)
 );

 if(winningLine){
  finished=true;
  scores[turn]++;
  status.textContent='Player '+turn+' wins!';
  winningLine.forEach(n=>cells[n].classList.add('winner'));
 }else if(board.every(Boolean)){
  finished=true;
  scores.D++;
  status.textContent="It's a draw!";
 }else{
  turn=turn==='X'?'O':'X';
  status.textContent="Player "+turn+"'s turn";
 }
 render();
}

function reset(){
 board=Array(9).fill('');
 turn='X';
 finished=false;
 status.textContent="Player X's turn";
 render();
}

cells.forEach((cell,i)=>cell.addEventListener('click',()=>play(i)));
document.getElementById('reset').addEventListener('click',reset);
reset();
</script>
</body>
</html>
